<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>提示词替换</title>
<style>
/* 配合 Magpie 插件桥接提供的主题色。 */
:root { color-scheme: light dark; --accent: var(--magpie-accent, #6254dc); --line: var(--magpie-line, #e4e4eb); --card: var(--magpie-card, #fff); --text: var(--magpie-text, #242632); --muted: var(--magpie-muted, #737785); }
@media (prefers-color-scheme: dark) { :root { --line: var(--magpie-line, #41414c); --card: var(--magpie-card, #25252d); --text: var(--magpie-text, #eeeef3); --muted: var(--magpie-muted, #b8b9c3); } }
:root[data-theme="dark"] { color-scheme: dark; --line: var(--magpie-line, #41414c); --card: var(--magpie-card, #25252d); --text: var(--magpie-text, #eeeef3); --muted: var(--magpie-muted, #b8b9c3); }
* { box-sizing: border-box; }
body { margin: 0; color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif; font-size: 13px; line-height: 1.55; }
.workspace { max-width: 1000px; padding: 34px 32px 56px; }
.page-header { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
.page-header > div:nth-child(2) { flex: 1; min-width: 0; }
.lang-switch { flex: none; min-height: 28px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--muted); font: inherit; font-size: 11.5px; font-weight: 650; cursor: pointer; }
.lang-switch:hover { border-color: var(--accent); color: var(--accent); }
.title-mark { display: grid; place-items: center; width: 44px; height: 44px; flex: none; border-radius: 13px; color: var(--accent); background: color-mix(in srgb, var(--accent) 11%, transparent); }
.title-mark svg { width: 24px; height: 24px; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
h1, h2, p { margin: 0; }
h1 { font-size: 21px; line-height: 1.3; letter-spacing: -.03em; font-weight: 700; }
.intro { color: var(--muted); margin-top: 4px; }
.notice { display: flex; gap: 11px; align-items: flex-start; padding: 13px 16px; margin-bottom: 20px; border: 1px solid color-mix(in srgb, #bc8c3f 30%, var(--line)); background: color-mix(in srgb, #e1ad57 8%, var(--card)); border-radius: 10px; }
.notice-icon { display: grid; place-items: center; flex: none; width: 18px; height: 18px; border: 1.5px solid #a6762d; border-radius: 50%; color: #a6762d; font-size: 11px; font-weight: 800; line-height: 1; margin-top: 1px; }
.notice strong { font-size: 12.5px; }
.notice p { color: var(--muted); margin-top: 2px; font-size: 12px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
.section-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 19px 22px 17px; border-bottom: 1px solid var(--line); }
h2 { font-size: 15px; line-height: 1.4; font-weight: 700; }
.section-heading p { margin-top: 3px; color: var(--muted); font-size: 12px; }
.section-tag { flex: none; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; color: var(--muted); font-size: 11px; }
.panel-body { padding: 20px 22px 22px; }
details.panel > .panel-body { padding-top: 18px; }
.field { display: block; margin: 0 0 20px; min-width: 0; }
.last-field { margin-bottom: 0; }
.label { display: block; margin-bottom: 7px; font-size: 12.5px; font-weight: 650; }
.optional { color: var(--muted); font-size: 11px; font-weight: 400; margin-left: 5px; }
.field textarea, .field input, .field select { display: block; width: 100%; border: 1px solid var(--line); border-radius: 7px; background: var(--magpie-input, var(--magpie-bg, Canvas)); color: var(--text); font: inherit; outline: none; }
.field textarea, .field input { padding: 10px 12px; }
.field select { min-height: 38px; padding: 8px 10px; }
.field textarea { resize: vertical; line-height: 1.6; }
#rules, #targets, #models, #protocols { font-family: var(--magpie-code, ui-monospace, Consolas, monospace); font-size: 12px; }
code { font-family: var(--magpie-code, ui-monospace, Consolas, monospace); font-size: 11.5px; padding: 1px 4px; border-radius: 4px; background: color-mix(in srgb, var(--text) 7%, transparent); }
.field textarea:focus, .field input:focus, .field select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent); }
::placeholder { color: var(--muted); opacity: .8; }
.field-hint { display: block; margin-top: 6px; color: var(--muted); font-size: 11.5px; line-height: 1.5; }
.scope-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
/* 已知调用方做成可点的小标签：不用记名字，点一下就是一行目标 */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: -8px 0 20px; }
.chips:empty { display: none; }
.chips button { padding: 3px 9px; border: 1px dashed var(--line); border-radius: 20px; background: transparent; color: var(--muted); font: inherit; font-size: 11.5px; cursor: pointer; }
.chips button:hover { border-color: var(--accent); border-style: solid; color: var(--accent); }
.chips button[data-on="1"] { border-style: solid; border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); background: color-mix(in srgb, var(--accent) 9%, transparent); color: var(--accent); }
.mini-check { display: flex; gap: 9px; align-items: flex-start; cursor: pointer; }
.mini-check input { margin-top: 3px; flex: none; }
.mini-check strong, .mini-check small { display: block; }
.mini-check span { font-size: 12.5px; font-weight: 650; }
.mini-check small { margin-top: 2px; color: var(--muted); font-size: 11.5px; font-weight: 400; line-height: 1.5; }
details.panel > summary { display: flex; align-items: baseline; gap: 10px; padding: 17px 22px; cursor: pointer; list-style: none; }
details.panel > summary::-webkit-details-marker { display: none; }
details.panel > summary::before { content: "▸"; color: var(--muted); font-size: 11px; }
details.panel[open] > summary::before { content: "▾"; }
details.panel > summary span { font-size: 15px; font-weight: 700; }
details.panel > summary small { color: var(--muted); font-size: 12px; }
details.panel[open] > summary { border-bottom: 1px solid var(--line); }
.row-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.row-actions button { min-height: 32px; padding: 5px 12px; border: 1px solid var(--line); border-radius: 7px; background: var(--card); color: var(--text); font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
.row-actions button:hover { border-color: var(--accent); }
.row-actions .field-hint { margin: 0; }
.save-bar { display: flex; justify-content: space-between; align-items: center; gap: 18px; padding: 17px 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
.enable-control { display: flex; align-items: center; gap: 11px; cursor: pointer; }
.enable-control input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.switch { position: relative; display: inline-block; width: 37px; height: 22px; flex: none; background: #afb2bf; border-radius: 20px; transition: background .15s; }
.switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: white; transition: transform .15s; }
.enable-control input:checked + .switch { background: var(--accent); }
.enable-control input:checked + .switch::after { transform: translateX(15px); }
.enable-control input:focus-visible + .switch { outline: 2px solid var(--accent); outline-offset: 3px; }
.enable-control strong, .enable-control small { display: block; }
.enable-control strong { font-size: 12.5px; }
.enable-control small { color: var(--muted); font-size: 11px; margin-top: 1px; }
.actions { display: flex; align-items: center; gap: 8px; }
.actions button { min-height: 36px; padding: 7px 14px; border: 1px solid var(--line); border-radius: 7px; background: var(--card); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }
.actions button:hover { border-color: var(--accent); }
.actions button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.actions button:disabled { opacity: .6; cursor: wait; }
.actions #save { background: var(--accent); border-color: var(--accent); color: #fff; }
#status { color: var(--muted); font-size: 12px; }
#status[data-kind="ok"] { color: #218261; }
#status[data-kind="error"] { color: #c34449; }
.current { padding: 22px 2px; }
.current pre { overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted); font-size: 11.5px; }
[hidden] { display: none !important; }
@media (max-width: 640px) { .workspace { padding: 22px 16px 36px; } .panel-body { padding: 18px 16px; } .section-heading { padding: 16px; } .scope-grid { grid-template-columns: 1fr; } .save-bar { align-items: stretch; flex-direction: column; padding: 16px; } .actions { justify-content: flex-end; flex-wrap: wrap; } #status { flex-basis: 100%; } }
@media (prefers-reduced-motion: reduce) { .switch, .switch::after { transition: none; } }

/* 脚本没加载成功时由纯 CSS 在 2.5 秒后露出来：页面能自己说明问题，而不是看起来坏了 */
.boot-hint { visibility: hidden; animation: boot-hint-in 0s 2.5s forwards; margin: 0 0 16px; padding: 11px 14px; border: 1px solid color-mix(in srgb, #bc8c3f 35%, var(--line)); border-radius: 9px; background: color-mix(in srgb, #e1ad57 10%, var(--card)); color: var(--text); font-size: 12.5px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.boot-hint button { min-height: 28px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: inherit; font: inherit; cursor: pointer; }
@keyframes boot-hint-in { to { visibility: visible; } }
@media (prefers-reduced-motion: reduce) { .boot-hint { animation: none; } }
</style>
<script src="boot.js" defer></script>
<script src="_magpie/bridge.js" defer></script>
<script src="page.js" defer></script>
</head>
<body>
<div id="boot-hint" class="boot-hint" role="alert"><span data-t="boot">页面脚本没有加载成功。刷新一次（Ctrl+R）通常即可恢复。</span></div>
<main class="workspace">
  <header class="page-header">
    <div class="title-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M6.5 5.5h8l3 3v10h-11v-13Z"/><path d="M14.5 5.5v3h3M9 12h6M9 15h4"/></svg></div>
    <div><h1 data-t="h1">提示词替换</h1><p class="intro" data-t="intro">设置网关如何处理发往模型的系统提示词，并选择对哪些软件生效。</p></div>
    <button type="button" id="lang" class="lang-switch" title="切换语言 / Switch language">EN</button>
  </header>

  <div class="notice" role="note"><span class="notice-icon" aria-hidden="true">!</span><div><strong data-t="notice.title">整体替换会影响 Agent 的行为</strong><p data-t="notice.body">原系统提示词中可能包含工具调用和工作方式的说明。可以先选「追加」验证链路，再决定是否整段替换。</p></div></div>

  <form id="form" autocomplete="off">
    <section class="panel" aria-labelledby="content-title">
      <div class="section-heading"><div><h2 id="content-title" data-t="sec.content">替换内容</h2><p data-t="sec.content.p">填写要使用的系统提示词。</p></div><span class="section-tag" id="mode-tag">替换</span></div>
      <div class="panel-body">
        <label class="field">
          <span class="label" data-t="label.preset">选择人格</span>
          <select id="preset"><option value="" data-t="preset.auto">自定义提示词</option></select>
          <small class="field-hint" id="preset-hint" data-t="preset.hint">选择后会填入下方，可继续编辑；点击「保存设置」后生效。</small>
        </label>
        <label class="field">
          <span class="label" data-t="label.prompt">提示词</span>
          <textarea id="prompt" rows="8" spellcheck="false" data-t-ph="prompt.ph" placeholder="在这里输入要使用的提示词…"></textarea>
          <small class="field-hint" data-t="prompt.hint">「删除」模式不需要填写；其余模式留空则本条不生效。</small>
        </label>
        <label class="field last-field">
          <span class="label" data-t="label.mode">处理方式</span>
          <select id="mode">
            <option value="replace" data-t="mode.replace">替换：整段换成上面的提示词</option>
            <option value="append" data-t="mode.append">追加：接在原系统提示词后面</option>
            <option value="prepend" data-t="mode.prepend">前置：放在原系统提示词前面</option>
            <option value="strip" data-t="mode.strip">删除：清空原系统提示词</option>
          </select>
          <small class="field-hint" data-t="mode.hint">拿不准先用「追加」：原提示词还在，只多一段你的，能立刻看出有没有生效。</small>
        </label>
      </div>
    </section>

    <section class="panel" aria-labelledby="scope-title">
      <div class="section-heading"><div><h2 id="scope-title" data-t="sec.scope">生效范围</h2><p data-t="sec.scope.p">magpie 对每个请求都记了调用方和上游，这里按它们挑。</p></div><span class="section-tag" id="scope-tag">全部软件</span></div>
      <div class="panel-body">
        <label class="field">
          <span class="label" data-t="label.scope">换哪些软件</span>
          <select id="scope">
            <option value="all" data-t="scope.all">所有接入 magpie 的软件</option>
            <option value="selected" data-t="scope.selected">只有下面列出的软件</option>
          </select>
        </label>
        <label class="field">
          <span class="label"><span data-t="label.targets">目标</span><span class="optional" data-t="optional.perLine">每行一条</span></span>
          <textarea id="targets" rows="5" spellcheck="false" placeholder="codex&#10;agent:claude-desktop&#10;provider:trae-cn&#10;!agent:magpie"></textarea>
          <small class="field-hint" data-t-html="targets.hint">不写前缀就是调用方。<code>agent:</code> 调用方、<code>provider:</code> 上游、<code>protocol:</code> 协议、<code>app:</code> 应用、<code>model:</code> 模型；<code>*</code> 通配，行首 <code>!</code> 排除；只写排除项表示「除了这些，其余都换」。</small>
        </label>
        <div class="chips" id="chips"></div>
        <label class="mini-check"><input id="debug" type="checkbox"><span><span data-t-html="label.debug">把新出现的调用方写进 <code>logs/app.log</code></span><small data-t-html="debug.hint">不知道某个软件叫什么，就打开它发一次消息，再看日志里的 <code>[prompt-override] caller</code>。</small></span></label>
      </div>
    </section>

    <details class="panel" id="advanced">
      <summary><span data-t="adv.summary">单独设置某些软件</span><small data-t="adv.summary.small">可选：给某个客户端配另一套提示词或另一种处理方式</small></summary>
      <div class="panel-body">
        <label class="field last-field">
          <span class="label"><span data-t="label.rules">规则</span><span class="optional" data-t="optional.json">JSON 数组</span></span>
          <textarea id="rules" rows="8" spellcheck="false" placeholder='[{"match":["codex"],"mode":"append","prompt":"只用中文回答"}]'></textarea>
          <small class="field-hint" data-t-html="rules.hint">命中第一条就用它，优先于上面的整体设置；每条可写 <code>match</code>（选择器数组）、<code>mode</code>、<code>prompt</code>、<code>replace_reminders</code>。留空表示不单独设置。</small>
        </label>
        <div class="row-actions"><button type="button" id="rules-sample" data-t="rules.sample">插入示例</button><span id="rules-hint" class="field-hint"></span></div>
      </div>
    </details>

    <div class="save-bar">
      <label class="enable-control"><input id="enabled" type="checkbox"><span class="switch" aria-hidden="true"></span><span><strong data-t="enable.strong">启用提示词处理</strong><small data-t="enable.small">开启后对支持的网关请求生效</small></span></label>
      <div class="actions"><span id="status" role="status" aria-live="polite"></span><button type="button" id="reload" data-t="btn.reload">重新读取</button><button type="button" id="save" data-t="btn.save">保存设置</button></div>
    </div>
  </form>
  <section id="current" class="current" hidden><h2 data-t="current.title">当前已保存的设置</h2><pre id="current-body"></pre></section>
</main>
</body>
</html>
